services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - api

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    expose:
      - "80"

  api:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wisery_academy}
      POSTGRES_USER: ${POSTGRES_USER:-wisery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wisery}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wisery} -d ${POSTGRES_DB:-wisery_academy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local/VPS use. In AWS this whole service goes
  # away and S3_ENDPOINT_URL in .env is pointed at real S3 instead.
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wisery-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wisery-admin-secret}
    ports:
      - "9001:9001"   # MinIO web console (bucket browser)
    volumes:
      - storage_data:/data

  # One-shot: creates the bucket on first boot so the API never 404s on it.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - storage
    env_file: .env
    entrypoint: >
      sh -c "
      until mc alias set local http://storage:9000 $${S3_ACCESS_KEY:-wisery-admin} $${S3_SECRET_KEY:-wisery-admin-secret}; do sleep 1; done;
      mc mb --ignore-existing local/$${S3_BUCKET:-wisery-academy-files};
      mc anonymous set none local/$${S3_BUCKET:-wisery-academy-files};
      exit 0;
      "

volumes:
  db_data:
  storage_data:
